services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8010:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/agentos.db
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - CHROMA_PERSIST_DIR=/app/chroma_data
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-text-embedding-004}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-please_change_this_secret}
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost"]
    volumes:
      - backend_data:/app/data
      - chroma_data:/app/chroma_data
      - uploads_data:/app/uploaded_documents
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8010}
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  redis_data:
  backend_data:
  chroma_data:
  uploads_data: